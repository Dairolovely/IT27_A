<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Voting System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- WELCOME PAGE -->
  <div id="welcomePage" class="screen active">
    <div class="content">
      <h1><b>Welcome</b><br>to the<br><b>Classroom Voting</b></h1>
      <button onclick="showPage('loginPage')">Proceed to Login</button>
    </div>
  </div>

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="screen">
    <div class="content">
      <h2>Student Login</h2>
      <form onsubmit="event.preventDefault(); validateLogin()">
        <label>Student ID</label>
        <input id="studentID" type="text" placeholder="Enter your ID" required>
        <p id="loginError" class="error"></p>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <!-- SECTION PAGE -->
  <div id="sectionPage" class="screen">
    <div class="content">
      <h2>Select Section</h2>
      <select id="sectionSelect" required>
        <option value="">-- Select Section --</option>
        <option>ICS A</option>
        <option>ICS B</option>
        <option>ICS C</option>
      </select>
      <button onclick="nextToVote()">Continue</button>
    </div>
  </div>

  <!-- VOTING PAGE -->
  <div id="votePage" class="screen">
    <div class="content">
      <h3>Choose 1 President</h3>
      <label><input type="radio" name="president" value="Lovely joy Dairo"> Lovely joy Dairo</label><br>
      <label><input type="radio" name="president" value="Ellaiza Dajang"> Ellaiza Dajang</label>

      <h3>Choose 1 Vice President</h3>
      <label><input type="radio" name="vp" value="Janela Anlagan"> Janela Anlagan</label><br>
      <label><input type="radio" name="vp" value="Fely Santos"> Fely Santos</label>

      <h3>Choose 1 Secretary</h3>
      <label><input type="radio" name="secretary" value="Jasmine Cruz"> Jasmine Cruz</label><br>
      <label><input type="radio" name="secretary" value="Ethan Velasco"> Ethan Velasco</label>

      <br><br>
      <button onclick="reviewVotes()">Review My Votes</button>
    </div>
  </div>

  <!-- REVIEW PAGE -->
  <div id="reviewPage" class="screen">
    <div class="content">
      <h2>Review Your Votes</h2>
      <p><b>President:</b> <span id="reviewPresident"></span></p>
      <p><b>Vice President:</b> <span id="reviewVP"></span></p>
      <p><b>Secretary:</b> <span id="reviewSecretary"></span></p>
      <button onclick="showPage('thankYouPage')">Submit</button>
    </div>
  </div>

  <!-- THANK YOU PAGE -->
  <div id="thankYouPage" class="screen">
    <div class="content">
      <h2>Thank you for Voting!</h2>
      <button onclick="showPage('welcomePage')">Logout</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
